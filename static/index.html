
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #10141f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #98a4b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Server time */

        .server-time {
            position: fixed;
            top: 20px;
            right: 24px;

            background: #1c2332;
            border: 1px solid #354057;
            border-radius: 10px;

            padding: 12px 18px;
            color: #aab5c6;
            font-size: 13px;
            font-family: monospace;
        }

        .server-time::before {
            content: "●";
            color: #4ade80;
            margin-right: 8px;
        }

        /* Calculator */

        .calculator {
            background: #1c2332;
            padding: 26px;
            border-radius: 18px;
        }

        label {
            display: block;
            color: #aab5c6;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #354057;
            border-radius: 8px;
            background: #111723;
            color: white;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #568dff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #3768e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4d7dff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* Result */

        .result {
            margin-top: 22px;
            background: #111723;
            padding: 20px;
            border-radius: 10px;
        }

        .result-label {
            color: #98a4b8;
            font-size: 13px;
        }

        #output {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        /* Mobile layout */

        @media (max-width: 600px) {
            body {
                flex-direction: column;
            }

            .server-time {
                position: static;
                margin: 20px auto 0;
                max-width: calc(100% - 32px);
                text-align: center;
            }

            .container {
                margin: auto 0;
            }
        }
    </style>
</head>

<body>

    <!-- Server clock -->
    <div class="server-time" id="serverTime">
        Loading server time...
    </div>

    <!-- Calculator -->
    <div class="container">
        <h1>C++ Calculator</h1>

        <p class="subtitle">
            Powered by your own C++ HTTP server
        </p>

        <div class="calculator">
            <form id="calculatorForm">

                <label for="a">First number</label>
                <input
                    type="number"
                    id="a"
                    step="any"
                    placeholder="Enter a number"
                    required
                >

                <label for="operation">Operation</label>
                <select id="operation">
                    <option value="add">+ Addition</option>
                    <option value="subtract">− Subtraction</option>
                    <option value="multiply">× Multiplication</option>
                    <option value="divide">÷ Division</option>
                </select>

                <label for="b">Second number</label>
                <input
                    type="number"
                    id="b"
                    step="any"
                    placeholder="Enter a number"
                    required
                >

                <button type="submit" id="calculateButton">
                    Calculate →
                </button>
            </form>

            <div class="result" aria-live="polite">
                <span class="result-label">Result</span>
                <span id="output">—</span>
            </div>
        </div>
    </div>

    <script>
        // ==================================
        // Calculator API
        // ==================================

        const form = document.getElementById("calculatorForm");
        const output = document.getElementById("output");
        const button = document.getElementById("calculateButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const a = document.getElementById("a").value;
            const b = document.getElementById("b").value;
            const op = document.getElementById("operation").value;

            const params = new URLSearchParams({
                a: a,
                b: b,
                op: op
            });

            output.textContent = "Calculating...";
            button.disabled = true;

            try {
                const response = await fetch(
                    "/api/calculate?" + params.toString()
                );

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(
                        result || "HTTP error " + response.status
                    );
                }

                output.textContent = result;
            }
            catch (error) {
                output.textContent = "Error: " + error.message;
            }
            finally {
                button.disabled = false;
            }
        });

        // ==================================
        // Server Clock API
        // ==================================

        async function updateServerTime() {
            const element = document.getElementById("serverTime");

            try {
                const response = await fetch("/api/time");

                if (!response.ok) {
                    throw new Error("Server time unavailable");
                }

                const time = await response.text();

                element.textContent = "Server: " + time.trim();
            }
            catch (error) {
                element.textContent = "Server unavailable";
            }
        }

        // Load immediately
        updateServerTime();

        // Refresh every 60 seconds
        setInterval(updateServerTime, 1000);

    </script>
</body>
</html>
